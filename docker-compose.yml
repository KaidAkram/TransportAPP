services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etransport_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=E-Transport ERP API
      - VERSION=1.0.0
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]
      - DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres
      - SUPABASE_URL=https://placeholder-project.supabase.co
      - SUPABASE_ANON_KEY=placeholder-anon-key
      - SUPABASE_KEY=placeholder-service-key
      - SUPABASE_JWT_SECRET=placeholder-jwt-secret
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: etransport_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_SUPABASE_URL=https://placeholder-project.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

networks:
  default:
    name: etransport_network
